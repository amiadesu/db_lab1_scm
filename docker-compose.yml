name: lab2

services:
  mongo:
    image: docker.io/library/mongo:8.0
    container_name: lab2-mongo
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodata:/data/db

  neo4j:
    image: docker.io/library/neo4j:5-community
    container_name: lab2-neo4j
    environment:
      NEO4J_AUTH: neo4j/lab2-password
    ports:
      - "127.0.0.1:7474:7474"   # Neo4j Browser
      - "127.0.0.1:7687:7687"   # Bolt
    volumes:
      - neo4jdata:/data

volumes:
  mongodata:
  neo4jdata:
